       </div>
       <div>
        <label data-template-id="reflection-next-label" for="reflection-next" class="canva-text block font-bold mb-2"></label><textarea id="reflection-next" required rows="3" maxlength="500" class="w-full p-3 border border-[#b9ccbd] rounded-xl"></textarea>
       </div><button data-template-id="reflection-submit" type="submit" class="canva-button primary"></button>
      </form>
      <div id="reflection-result" class="hidden-state bg-white rounded-3xl p-6 mt-5" hidden aria-live="polite">
       <h2>Refleksimu</h2>
       <div id="reflection-summary" class="space-y-2 mt-3"></div>
      </div>
     </div>
    </section>
   </main>
   <footer class="max-w-6xl mx-auto px-5 sm:px-8 pb-8 text-sm text-[#54736b]">
    <p data-template-id="footer-credit" class="canva-text"></p>
   </footer>
  </div>
  <script>
(() => {
  const screens = document.querySelectorAll('.screen');
  const show = id => { screens.forEach(s => s.hidden = s.id !== id); window.scrollTo({top:0,behavior:'smooth'}); };
  document.getElementById('entry-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('student-name').value.trim();
    const kelas = document.getElementById('student-class').value.trim();
    if (!name || !kelas) return;
    document.getElementById('welcome').textContent = `Halo, ${name} dari kelas ${kelas}! Pilih petualangan belajarmu di bawah ini.`;
    show('home');
  });
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => show(b.dataset.open)));
  document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => show('home')));

  // Pertanyaan dan kunci jawaban adalah data kegiatan, bukan teks presentasi yang dikelola editor.
  const banks = {
    awal: [
      ['Apa yang dimaksud sumber daya alam?', ['Segala sesuatu dari alam yang dapat dimanfaatkan','Semua barang buatan pabrik','Hanya benda yang berada di laut','Semua bangunan di kota'],0],
      ['Manakah contoh sumber daya alam dari laut?', ['Batu bata','Ikan','Sepeda','Kertas'],1],
      ['Manakah yang termasuk sumber daya alam tidak dapat diperbarui?', ['Angin','Air hujan','Batu bara','Ikan'],2],
      ['Apa manfaat hutan selain menghasilkan kayu?', ['Menjaga habitat dan ketersediaan air','Membuat semua tambang baru','Menghilangkan kebutuhan air','Menghentikan hujan'],0],
      ['Di mana ikan dan terumbu karang banyak ditemukan?', ['Perairan laut','Jalan raya','Kawasan pabrik','Puncak gunung'],0],
      ['Apa yang dapat terjadi jika sungai tercemar?', ['Air menjadi lebih bersih','Pemanfaatan air terganggu','Ikan bertambah tanpa batas','Tanah berubah menjadi emas'],1],
      ['Manakah contoh kegiatan menjaga lingkungan?', ['Membuang sampah ke sungai','Menebang tanpa menanam lagi','Menghemat penggunaan air','Merusak terumbu karang'],2],
      ['Mengapa potensi SDA tiap daerah berbeda?', ['Kondisi alam tiap daerah berbeda','Semua daerah memiliki alam yang sama','Semua daerah memiliki tambang yang sama','Hanya bergantung pada nama daerah'],0],
      ['Apa contoh hasil tambang?', ['Mangrove','Timah','Padi','Ikan'],1],
      ['Mengapa SDA perlu dikelola secara bijak?', ['Agar tetap bermanfaat bagi generasi berikutnya','Agar cepat habis','Agar air makin tercemar','Agar hutan kehilangan fungsinya'],0]
    ],
    akhir: [
      ['Apa perbedaan utama SDA dapat diperbarui dan tidak dapat diperbarui?', ['Yang pertama dapat tersedia kembali melalui proses alam atau pengelolaan; yang kedua terbentuk sangat lama','Keduanya selalu tersedia tanpa batas','Yang pertama hanya ada di laut','Yang kedua selalu cepat pulih'],0],
      ['Penebangan hutan tanpa pemulihan berisiko menyebabkan…', ['Fungsi hutan menurun','Air selalu bertambah','Tambang pulih lebih cepat','Terumbu karang tumbuh di darat'],0],
      ['Kelompok potensi SDA yang dibahas dalam materi IPS kelas VII adalah…', ['Hutan, tambang, dan kemaritiman','Gedung, jalan, dan kendaraan','Pasar, sekolah, dan kantor','Komputer, telepon, dan televisi'],0],
      ['Mengapa batu bara sebaiknya digunakan secara hemat?', ['Pembentukannya memerlukan waktu sangat lama','Dapat ditanam kembali setiap minggu','Jumlahnya selalu bertambah','Tidak mempunyai manfaat'],0],
      ['Tindakan yang melindungi kehidupan pesisir adalah…', ['Menjaga mangrove dan terumbu karang','Membuang limbah ke laut','Menangkap ikan dengan merusak karang','Menebang seluruh mangrove'],0],
      ['Tanah dan air penting bagi kegiatan ekonomi terutama karena…', ['Mendukung pertanian dan kebutuhan sehari-hari','Hanya digunakan untuk tambang','Tidak dipakai manusia','Selalu tersedia tanpa pengelolaan'],0],
      ['Suatu daerah menghasilkan ikan tetapi terumbu karangnya rusak. Pilihan terbaik adalah…', ['Menjaga habitat sambil mengelola penangkapan ikan','Menangkap ikan sebanyak mungkin dengan cara apa pun','Membuang sampah ke pesisir','Mengabaikan kerusakan karang'],0],
      ['Pemanfaatan hasil tambang yang bertanggung jawab mencakup…', ['Penghematan dan pemulihan lingkungan terdampak','Meninggalkan lahan rusak','Membuang limbah sembarangan','Mengambil tanpa memperhatikan lingkungan'],0],
      ['Mengapa pelestarian tidak terpisah dari pemanfaatan SDA?', ['Karena kondisi lingkungan memengaruhi manfaat SDA pada masa depan','Karena pelestarian selalu menghentikan kegiatan ekonomi','Karena SDA tidak mungkin rusak','Karena semua SDA tidak terbatas'],0],
      ['Contoh keputusan berkelanjutan di lingkungan sekolah adalah…', ['Menghemat air dan energi serta memilah sampah','Membiarkan keran terbuka','Membuang sampah ke selokan','Menggunakan energi tanpa perlu'],0]
    ]
  };
  const quizState = {};
  function renderQuiz(kind) {
    const mount = document.getElementById(kind + '-quiz');
    const state = quizState[kind] || (quizState[kind] = {index:0,score:0,answered:false});
    const questions = banks[kind];
    mount.replaceChildren();
    if (state.index >= questions.length) {
      const box = document.createElement('div');
      box.className = 'bg-white rounded-3xl p-6';
      const title = document.createElement('h2'); title.textContent = 'Selesai!'; box.append(title);
      const result = document.createElement('p'); result.className='my-4 font-bold'; result.textContent = `Jawaban benar: ${state.score} dari 10. ${state.score >= 8 ? 'Hebat! Pertahankan pemahamanmu.' : 'Terus belajar, lalu coba lagi!'}`; box.append(result);
      const retry = document.createElement('button'); retry.type='button'; retry.className='primary'; retry.textContent='Ulangi kuis';
      retry.addEventListener('click',()=>{quizState[kind]={index:0,score:0,answered:false};renderQuiz(kind)});box.append(retry);mount.append(box);return;
    }
    const [question, answers, correct] = questions[state.index];
    const box = document.createElement('div'); box.className='bg-white rounded-3xl p-5 sm:p-8';
    const count = document.createElement('p');count.className='eyebrow text-[#54736b] mb-3';count.textContent=`Soal ${state.index+1} / 10`;box.append(count);
    const heading=document.createElement('h2');heading.className='mb-6';heading.textContent=question;box.append(heading);
    const choices=document.createElement('div');choices.className='grid sm:grid-cols-2 gap-3';
    const feedback=document.createElement('p');feedback.className='mt-5 font-bold min-h-6';feedback.setAttribute('role','status');
    const next=document.createElement('button');next.className='primary mt-4';next.type='button';next.textContent=state.index===9?'Lihat hasil':'Soal berikutnya';next.hidden=true;
    answers.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=`${'ABCD'[i]}. ${answer}`;b.addEventListener('click',()=>{
      if(state.answered)return;state.answered=true;
      if(i===correct)state.score++;
      choices.querySelectorAll('button').forEach((btn,j)=>{btn.disabled=true;if(j===correct)btn.classList.add('correct');else if(j===i)btn.classList.add('wrong')});
      feedback.textContent=i===correct?'Benar! Bagus sekali.':`Belum tepat. Jawaban yang benar: ${answers[correct]}.`;
      next.hidden=false;next.focus();
    });choices.append(b)});
    next.addEventListener('click',()=>{state.index++;state.answered=false;renderQuiz(kind)});
    box.append(choices,feedback,next);mount.append(box);
  }
  document.querySelectorAll('[data-open="awal"],[data-open="akhir"]').forEach(b=>b.addEventListener('click',()=>renderQuiz(b.dataset.open)));

  const simulations=[
    {s:'Sebuah desa memanfaatkan hutan untuk kebutuhan warganya. Apa keputusanmu?',o:[['Menebang semua pohon tanpa pemulihan','Fungsi hutan dan habitat dapat menurun. Coba pikirkan cara memulihkannya.'],['Memanfaatkan seperlunya dan menanam kembali','Pilihan bijak! Pemanfaatan disertai pemulihan menjaga manfaat hutan.']]},
    {s:'Kegiatan tambang selesai di suatu lahan. Apa yang perlu dilakukan?',o:[['Membiarkan lahan rusak','Lahan yang ditinggalkan dapat terus berdampak pada lingkungan.'],['Memulihkan lahan dan mengelola limbah','Tepat! Pemulihan dan pengelolaan limbah membantu mengurangi dampak.']]},
    {s:'Nelayan ingin menangkap ikan di dekat terumbu karang. Cara mana yang kamu pilih?',o:[['Menggunakan cara yang tidak merusak habitat','Bagus! Ikan dimanfaatkan tanpa merusak rumahnya.'],['Merusak karang agar tangkapan cepat banyak','Karang yang rusak dapat mengganggu kehidupan laut dan hasil di masa depan.']]}
  ];
  function showSim(i){const data=simulations[i], options=document.getElementById('sim-options');document.getElementById('sim-situation').textContent=data.s;document.getElementById('sim-feedback').textContent='';options.replaceChildren();data.o.forEach(([label,result])=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=label;b.addEventListener('click',()=>{options.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('sim-feedback').textContent=result});options.append(b)})}
  document.querySelectorAll('.sim-tab').forEach(b=>b.addEventListener('click',()=>showSim(Number(b.dataset.sim))));showSim(0);

  const puzzlePieces=['Kenali potensi SDA','Manfaatkan seperlunya','Jaga dan pulihkan alam','Manfaat tetap tersedia'];
  let puzzleOrder=[], firstTile=null;
  function drawPuzzle(){
    const board=document.getElementById('puzzle-board');board.replaceChildren();firstTile=null;
    puzzleOrder.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=`${i+1}. ${puzzlePieces[n]}`;b.setAttribute('aria-label',`Posisi ${i+1}: ${puzzlePieces[n]}`);b.addEventListener('click',()=>{
      if(firstTile===null){firstTile=i;b.classList.add('active');return}
      [puzzleOrder[firstTile],puzzleOrder[i]]=[puzzleOrder[i],puzzleOrder[firstTile]];
      drawPuzzle();
      document.getElementById('puzzle-status').textContent=puzzleOrder.every((v,k)=>v===k)?'🎉 Urutan tepat! Pemanfaatan dan pelestarian berjalan bersama.':'Belum tepat. Pilih dua keping lagi untuk menukarnya.';
    });board.append(b)});
  }
  function resetPuzzle(){puzzleOrder=[2,0,3,1];document.getElementById('puzzle-status').textContent='Pilih dua keping untuk menukar posisinya.';drawPuzzle()}
  document.getElementById('puzzle-reset').addEventListener('click',resetPuzzle);resetPuzzle();

  const pairs=[['Kayu','Hutan'],['Timah','Tambang'],['Ikan','Laut'],['Mangrove','Pesisir']];
  let selectedItem=null,matched=new Set();
  function resetMatch(){
    matched=new Set();selectedItem=null;
    const left=document.getElementById('match-items'),right=document.getElementById('match-targets');left.replaceChildren();right.replaceChildren();
    [2,0,3,1].forEach(i=>{const b=document.createElement('button');b.type='button';b.className='choice match';b.textContent=pairs[i][0];b.dataset.pair=i;b.addEventListener('click',()=>{if(matched.has(i))return;selectedItem=i;left.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('match-status').textContent=`${pairs[i][0]} dipilih. Pilih kategorinya.`});left.append(b)});
    [1,3,0,2].forEach(i=>{const b=document.createElement('button');b.type='button';b.className='choice match';b.textContent=pairs[i][1];b.dataset.pair=i;b.addEventListener('click',()=>{const status=document.getElementById('match-status');if(selectedItem===null){status.textContent='Pilih sumber daya di kolom kiri dahulu.';return}if(selectedItem!==i){status.textContent='Belum cocok. Coba kategori lain.';return}matched.add(i);left.querySelector(`[data-pair="${i}"]`).classList.add('done');b.classList.add('done');selectedItem=null;status.textContent=matched.size===pairs.length?'🎉 Semua pasangan cocok!':'Cocok! Lanjutkan pasangan berikutnya.'});right.append(b)});
    document.getElementById('match-status').textContent='Pilih sumber daya, lalu pilih kategorinya.';
  }
  document.getElementById('match-reset').addEventListener('click',resetMatch);resetMatch();

  document.getElementById('reflection-form').addEventListener('submit',e=>{
    e.preventDefault();const form=e.currentTarget;const values=[
      `Pemahamanku: ${form.elements.understanding.value}`,
      `Perasaanku: ${form.elements.feeling.value}`,
      `Hal yang kupelajari: ${document.getElementById('reflection-learn').value.trim()}`,
      `Langkah belajarku berikutnya: ${document.getElementById('reflection-next').value.trim()}`
    ];
    const summary=document.getElementById('reflection-summary');summary.replaceChildren();
    values.forEach(v=>{const p=document.createElement('p');p.textContent=v;summary.append(p)});
    document.getElementById('reflection-result').hidden=false;
  });
})();
</script>
 </body>
</html>
